<section class="captura-container">
  <div class="captura-header">
    <h2>Cargar Imagen del Residuo</h2>
    <p>Sube una foto clara del objeto que deseas reciclar o reutilizar.</p>
  </div>

  <div class="upload-card">
    <div class="drop-zone">
      <div class="upload-icon">📷</div>
      <p class="drop-text">Arrastra y suelta tu imagen aquí</p>
      <span class="or-text">o</span>
      <label for="file-input" class="btn-file">Seleccionar Archivo</label>
      <input type="file" id="file-input" accept="image/*" class="file-input" />
    </div>

    <div class="actions">
      <button class="btn-primary" disabled>Analizar Imagen</button>
    </div>
  </div>
</section>
