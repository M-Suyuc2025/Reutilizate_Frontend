<section class="captura-container">
  <div class="captura-header">
    <h2>Cargar Imagen del Residuo</h2>
    <p>Sube una foto clara del objeto que deseas reciclar o reutilizar.</p>
  </div>

  <div class="upload-card">
    <div 
      class="drop-zone" 
      *ngIf="!imagenPreview"
      (dragover)="onDragOver($event)" 
      (drop)="onDrop($event)"
    >
      <div class="upload-icon">📷</div>
      <p class="drop-text">Arrastra y suelta tu imagen aquí</p>
      <span class="or-text">o</span>
      
      <label for="fileInput" class="btn-file">
        Seleccionar Archivo
      </label>
      <input 
        type="file" 
        id="fileInput" 
        class="file-input" 
        accept="image/*" 
        (change)="onFileSelected($event)"
      />
    </div>

    <div class="preview-container" *ngIf="imagenPreview">
      <img [src]="imagenPreview" alt="Vista previa del residuo" class="image-preview" />
      <button class="btn-file change-file" (click)="limpiarImagen()">
        Cambiar imagen
      </button>
    </div>

    <p class="aviso-sesion" *ngIf="!logueado">
      💡 Inicia sesión para ganar puntos y ver ideas de reutilización.
    </p>
    <p class="error-msg" *ngIf="errorMensaje">{{ errorMensaje }}</p>

    <div class="actions">
      <button 
        class="btn-primary" 
        [disabled]="!archivoSeleccionado || cargando"
        (click)="analizarImagen()"
      >
        {{ cargando ? 'Analizando...' : 'Analizar Imagen' }}
      </button>
    </div>
  </div>
</section>
