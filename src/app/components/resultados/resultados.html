<section class="resultados-container" *ngIf="resultado">
  <div class="resultados-grid-layout">
    <!-- COLUMNA IZQUIERDA: Textos y Resultados -->
    <div class="columna-izquierda">
      <div class="resultado-header">
        <h2>Resultado del Análisis</h2>
        <p>Identificamos tu residuo e ideamos sugerencias para su reutilización.</p>
      </div>

      <div class="material-card">
        <span class="badge">Material Detectado</span>
        <h3>{{ resultado.material }}</h3>
        <p>{{ resultado.descripcion }}</p>
      </div>

      <div class="proyectos-seccion">
        <h3>Proyectos Recomendados</h3>
        <div class="proyectos-grid">
          <div class="proyecto-card" *ngFor="let p of resultado.proyectos">
            <div class="proyecto-header">
              <h4>{{ p.nombre }}</h4>
              <span class="dificultad">{{ p.dificultad }}</span>
            </div>
            <p>{{ p.descripcion }}</p>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" (click)="volverACapturar()">
          Escanear otro objeto
        </button>
      </div>
    </div>

    <div class="columna-derecha" *ngIf="resultado.imagen">
      <div class="imagen-box">
        <img [src]="resultado.imagen" alt="Foto del residuo" class="imagen-escaneada" />
      </div>
    </div>
  </div>
</section>
