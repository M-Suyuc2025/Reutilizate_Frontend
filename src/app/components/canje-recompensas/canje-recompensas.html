<section class="canje-container">
  <div class="canje-header">
    <h2>Catálogo de Recompensas</h2>
    <p>Canjea tus puntos acumulados por premios e incentivos ecológicos.</p>
    
    <div class="puntos-banner">
      <span>Puntos Disponibles:</span>
      <strong>{{ puntosUsuario }} pts</strong>
    </div>
  </div>

  <p class="mensaje exito" *ngIf="exitoMensaje">{{ exitoMensaje }}</p>
  <p class="mensaje error" *ngIf="errorMensaje">{{ errorMensaje }}</p>
  <p class="mensaje" *ngIf="cargando">Cargando recompensas...</p>

  <div class="recompensas-grid">
    <div class="recompensa-card" *ngFor="let recompensa of recompensas">
      <div class="card-top">
        <span class="recompensa-badge">{{ recompensa.costPoints }} Puntos</span>
      </div>
      
      <h3>{{ recompensa.name }}</h3>
      <p>{{ recompensa.description }}</p>

      <button 
        class="btn-canjear" 
        (click)="canjearPremio(recompensa)"
        [disabled]="puntosUsuario < recompensa.costPoints || canjeandoId !== null"
        [class.disabled]="puntosUsuario < recompensa.costPoints">
        {{ puntosUsuario >= recompensa.costPoints ? 'Canjear Premio' : 'Puntos Insuficientes' }}
      </button>
    </div>
  </div>
</section>
