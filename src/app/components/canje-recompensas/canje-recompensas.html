<section class="canje-container">
  <div class="canje-header">
    <h2>Catálogo de Recompensas</h2>
    <p>Canjea tus puntos acumulados por premios e incentivos ecológicos.</p>
    
    <div class="puntos-banner">
      <span>Puntos Disponibles:</span>
      <strong>{{ puntosUsuario }} pts</strong>
    </div>
  </div>

  <div class="recompensas-grid">
    <div class="recompensa-card" *ngFor="let recompensa of recompensas">
      <div class="card-top">
        <span class="recompensa-badge">{{ recompensa.puntos }} Puntos</span>
        <span class="categoria-tag">{{ recompensa.categoria }}</span>
      </div>
      
      <h3>{{ recompensa.titulo }}</h3>
      <p>{{ recompensa.descripcion }}</p>

      <button 
        class="btn-canjear" 
        (click)="canjearPremio(recompensa)"
        [disabled]="puntosUsuario < recompensa.puntos"
        [class.disabled]="puntosUsuario < recompensa.puntos">
        {{ puntosUsuario >= recompensa.puntos ? 'Canjear Premio' : 'Puntos Insuficientes' }}
      </button>
    </div>
  </div>
</section>
