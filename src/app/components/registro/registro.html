<div class="registro-container">
  <h2>Crear cuenta</h2>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        formControlName="nombre"
        placeholder="Tu nombre"
      />
      <div class="error-mensaje" *ngIf="nombre?.invalid && nombre?.touched">
        <span *ngIf="nombre?.errors?.['required']">El nombre es obligatorio.</span>
        <span *ngIf="nombre?.errors?.['minlength']">Debe tener al menos 2 caracteres.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="tucorreo@ejemplo.com"
      />
      <div class="error-mensaje" *ngIf="email?.invalid && email?.touched">
        <span *ngIf="email?.errors?.['required']">El correo es obligatorio.</span>
        <span *ngIf="email?.errors?.['email']">Ingresa un correo válido.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="••••••••"
      />
      <div class="error-mensaje" *ngIf="password?.invalid && password?.touched">
        <span *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</span>
        <span *ngIf="password?.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        id="confirmarPassword"
        type="password"
        formControlName="confirmarPassword"
        placeholder="••••••••"
      />
      <div class="error-mensaje" *ngIf="confirmarPassword?.touched && registroForm.errors?.['passwordsNoCoinciden']">
        Las contraseñas no coinciden.
      </div>
    </div>

    <div class="error-mensaje general" *ngIf="errorMensaje">
      {{ errorMensaje }}
    </div>

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Creando cuenta...' : 'Registrarme' }}
    </button>

    <p class="link-login">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>

  </form>
</div>
